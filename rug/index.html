/* Layout: full-height canvas room under a slim HUD; PUMP button floats bottom-right at the thumb. Top-down trading-floor rooms, tinted per floor. */
:root{
  --table:#141a2b; --panel:#1b2238; --ink:#eef0f7; --muted:#9aa3c0; --line:#ffffff1c;
  --gold:#e3b54a; --ivory:#f4ecd8; --you:#3fbf7a; --foe:#e2574c; --info:#7fb3ff;
  --f-display:"SVDisplay","Bungee","Arial Black",system-ui,sans-serif; --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--table);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;gap:7px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:18px;line-height:1;color:var(--gold);text-decoration:none;display:block}
.logo small{display:block;font:600 10px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.hud{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.where{font:800 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.3}
.hype{font:800 14px var(--f-body);color:var(--gold);white-space:nowrap}.hype::before{content:"◆ "}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff0d;color:var(--ink);font:800 14px var(--f-body);cursor:pointer;display:grid;place-items:center;flex:none}
.party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pm{display:flex;align-items:center;gap:4px;min-width:0}
.pm img{width:28px;height:28px;border-radius:8px;object-fit:cover;object-position:top;background:var(--ivory);flex:none}
.pm .b{flex:1;height:5px;border-radius:9px;background:#ffffff18;overflow:hidden}.pm .b i{display:block;height:100%;background:var(--you)}
.pm.down img{filter:grayscale(1) brightness(.5)}
.pm.empty{border:1px dashed #ffffff26;border-radius:8px;height:28px}
#stage{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;border-radius:14px;padding:7px 14px;font:700 13px/1.35 var(--f-body);text-align:center;pointer-events:none;transition:opacity .4s;width:max-content;max-width:calc(100% - 24px)}
.pump{position:absolute;right:14px;bottom:14px;width:78px;height:78px;border-radius:50%;border:0;cursor:pointer;background:conic-gradient(var(--gold) calc(var(--p,1)*360deg),#ffffff22 0);display:grid;place-items:center;box-shadow:0 6px 18px #000a}
.pump span{width:66px;height:66px;border-radius:50%;background:#1a1405;color:var(--gold);display:grid;place-items:center;font:400 12px/1.05 var(--f-display);text-align:center}
.pump.ready span{background:var(--gold);color:#1a1405}
.pump.active span{background:var(--you);color:#06210f}
.pump:focus-visible{outline:2px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:#070a12d9;display:grid;place-items:center;padding:18px;z-index:50}
.box{width:min(380px,100%);max-height:calc(100% - 8px);overflow:auto;background:linear-gradient(170deg,#232c4a,#161c30);border:1px solid #e3b54a66;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000a}
.box h2{margin:0;font:400 20px var(--f-display);color:var(--gold);text-wrap:balance}
.box p{margin:0;font-size:14px;line-height:1.5;color:#d6dae8}
.msg{background:#ffffff0a;border-radius:10px;padding:12px;font-size:14px;line-height:1.5;font-style:italic}
.who{display:flex;align-items:flex-start;gap:10px}.who img{width:46px;height:46px;border-radius:12px;background:var(--ivory);object-fit:cover;object-position:top;flex:none}
.lesson{background:#ffffff0d;border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.45}
.lesson span{display:block;font:800 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.lesson.bad{border-left-color:var(--foe)}.lesson.bad span{color:var(--foe)}
.btn{border:0;border-radius:12px;padding:13px;background:var(--gold);color:#1a1405;font:800 15px var(--f-body);cursor:pointer;width:100%}
.btn.ghost{background:#ffffff14;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.pick:focus-visible,.up:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick{position:relative;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit}
.pick img{display:block;width:100%;aspect-ratio:1.4;object-fit:cover;object-position:top;background:var(--ivory)}
.pick .m{display:block;padding:7px 9px 9px}
.pick b{display:block;font-size:13px}.pick .ab{font:800 10px var(--f-body);color:var(--gold)}
.pick .tx{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
.pick.on{outline:3px solid var(--you);outline-offset:-3px}
.up{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.up .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#7fb3ff22;color:var(--info);font:400 16px var(--f-display)}
.up b{display:block;font-size:14px}.up span{font-size:12px;color:var(--muted)}
.up:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.stats div{background:#ffffff0a;border-radius:10px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.sub{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
</style>

<script>
// Degen Battlegrounds: deterministic-per-seed auto-battle engine. No DOM.
// Works in the browser (global BG) and in Node (module.exports) for balance simulation.
(function(root){
const ROSTER={
 bull:      {name:'Bull',          rar:'Rare',      hp:108,atk:13,def:3, spd:.80,ab:'Momentum',      txt:'First hit deals double. Gains +4% attack after every hit.',sp:'Stampede',sptxt:'Your next 4 hits deal double damage.'},
 bear:      {name:'Bear',          rar:'Rare',      hp:128,atk:12,def:4, spd:.74,ab:'Dump',          txt:'Each hit lowers the target\'s attack by 10% (stacks 2x).',sp:'Bear Raid',sptxt:'All enemies lose 30% attack for 6 seconds.'},
 whale:     {name:'Whale',         rar:'Epic',      hp:128,atk:15,def:4, spd:.50,ab:'Market Order',  txt:'Every 3rd hit deals 2.6x damage and splashes 20% to the rest of the team.',sp:'Big Market Order',sptxt:'A 3x hit on the target that also hits everyone else for half.'},
 diamond:   {name:'Diamond Hands', rar:'Epic',      hp:182,atk:10,def:7, spd:.62,ab:'Unbreakable',   txt:'No single hit can take more than 12% of his max HP.',sp:'HODL',sptxt:'Your whole team takes half damage for 5 seconds.'},
 rugpuller: {name:'Rugpuller',     rar:'Legendary', hp:104,atk:12,def:2, spd:.80,ab:'Pull the Rug',  txt:'Once, below 50% HP: wipes all enemy buffs and hits every enemy for 14% of their max HP. Costs 15% of his own max HP.',sp:'Rug Pull',sptxt:'Every enemy loses 12% of max HP and all their buffs.'},
 maxi:      {name:'Bitcoin Maxi',  rar:'Rare',      hp:140,atk:10,def:9, spd:.66,ab:'Never Selling', txt:'Highest defense. Survives the first lethal hit with 1 HP.',sp:'Laser Eyes',sptxt:'Two 2x hits that ignore defense.'},
 degen:     {name:'Degen',         rar:'Rare',      hp:98, atk:15,def:1, spd:.92,ab:'Full Send',     txt:'Every hit rolls between 0.2x and 2.6x damage, and may hit a random enemy instead of the front.',sp:'100x Long',sptxt:'60% chance of a 4.5x hit. Otherwise he loses 8% of his own HP.'},
 shiller:   {name:'Serial Shiller',rar:'Common',    hp:126,atk:9, def:2, spd:.86,ab:'Pump It',       txt:'Every 3rd hit also pumps the weakest ally: +50% attack for 4 hits.',sp:'Shill Thread',sptxt:'Your whole team gets +50% attack for 6 seconds.'},
 fudster:   {name:'Serial FUDster',rar:'Common',    hp:100,atk:10,def:2, spd:.86,ab:'Spread FUD',    txt:'Hits make the target panic: its next attack has a 60% chance to miss.',sp:'FUD Storm',sptxt:'Enemy attacks miss half the time for 5 seconds.'},
 crab:      {name:'Crab',          rar:'Common',    hp:150,atk:9, def:6, spd:.60,ab:'Sideways',      txt:'Reflects 35% of damage taken back to the attacker.',sp:'Shell Up',sptxt:'Takes half damage and reflects all of it for 4 seconds.'},
 shrimp:    {name:'Shrimp',        rar:'Common',    hp:86, atk:7, def:1, spd:1.10,ab:'Stack Sats',   txt:'Tiny but fast. Gains +0.6 attack with every hit, no limit.',sp:'Stack Harder',sptxt:'+6 attack for the rest of the battle and heals 15%.'},
 paperhands:{name:'Paper Hands',   rar:'Common',    hp:100,atk:15,def:1, spd:1.00,ab:'Panic Sell',   txt:'Fast and dodges 25% of hits. Below 35% HP, each hit taken has a 20% chance he flees the battle.',sp:'Panic Buy',sptxt:'Dodges everything for 2 seconds and heals 15%.'},
 nocoiner:  {name:'Nocoiner',      rar:'Common',    hp:116,atk:13,def:3, spd:.76,ab:'Told You So',   txt:'Deals +75% damage to enemies below 50% HP.',sp:'Told You So',sptxt:'Finishes off a target below 35% HP. Otherwise a 2.6x hit that ignores defense.'}
};
const HP_SCALE=2.8;
const FRONT_FOCUS=0.6;        // chance an attack goes to the front unit            // global pacing knob: battles of roughly 30-60 seconds
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}

function makeUnit(id,side,slot,mult=1){const b=ROSTER[id];const hp=Math.round(b.hp*HP_SCALE*mult);
 return{id,side,slot,name:b.name,maxHp:hp,hp,atk:b.atk*mult,def:b.def,spd:b.spd,t:0.35+slot*0.18,
  hits:0,actions:0,firstHit:true,momentum:1,dumped:0,pump:0,panic:false,saved:false,rugged:false,stack:0,alive:true,fled:false,dmgDone:0,dmgTaken:0,
  en:0,fx:{},dbl:0,wait:-1,specials:0};}

function Battle(teamA,teamB,opts={}){
 const r=rng(opts.seed||Date.now());
 const A=teamA.map((id,i)=>makeUnit(id,'A',i,opts.multA||1));
 const B=teamB.map((id,i)=>makeUnit(id,'B',i,opts.multB||1));
 for(const u of [...A,...B])u.t=0.2+r()*0.7;  // random opening: who strikes first changes every battle
 const all=[...A,...B];let time=0,done=null;const ev=[];
 const foes=u=>(u.side==='A'?B:A).filter(x=>x.alive);
 const mates=u=>(u.side==='A'?A:B).filter(x=>x.alive);
 const emit=(type,o)=>ev.push({type,time,...o});
 // timed effects from specials: {key:{v,until}}
 const fxv=(u,k,d)=>{const e=u.fx[k];return e&&e.until>time?e.v:d};
 const setfx=(u,k,v,dur)=>{u.fx[k]={v,until:time+dur}};
 const effAtk=u=>u.atk*u.momentum*(u.pump>0?1.5:1)*Math.pow(0.90,u.dumped)*fxv(u,'atk',1)+u.stack;
 const gain=(u,n)=>{if(u.alive)u.en=Math.min(100,u.en+n)};
 let focus=null;

 function damage(src,tgt,raw,kind){
  if(!tgt.alive)return 0;
  if(tgt.id==='paperhands'&&kind!=='aoe'&&r()<0.25){emit('dodge',{u:tgt});return 0}
  if(kind!=='aoe'&&kind!=='special'&&fxv(tgt,'dodge',0)){emit('dodge',{u:tgt});return 0}

  if(time>40)d*=1+(time-40)*0.10;  // Liquidation cascade: damage ramps up after 40s
  d=Math.round(d);
  if(tgt.id==='maxi'&&!tgt.saved&&d>=tgt.hp){tgt.saved=true;d=tgt.hp-1;emit('ability',{u:tgt,text:'Never Selling!'})}

  if(tgt.id==='crab'&&src&&src.alive&&kind!=='reflect'){const back=Math.max(1,Math.round(d*fxv(tgt,'reflect',0.35)));src.hp-=back;emit('hit',{src:tgt,u:src,d:back,kind:'reflect'});checkDeath(src)}
  if(tgt.id==='paperhands'&&tgt.hp>0&&tgt.hp<tgt.maxHp*0.35&&r()<0.20){tgt.alive=false;tgt.fled=true;emit('flee',{u:tgt})}
  checkDeath(tgt);
  if(tgt.id==='rugpuller'&&tgt.alive&&!tgt.rugged&&tgt.hp<tgt.maxHp*0.5)rugpull(tgt);
  return d;}
 function checkDeath(u){if(u.alive&&u.hp<=0){u.hp=0;u.alive=false;emit('ko',{u})}}
 function rugpull(u){u.rugged=true;emit('ability',{u,text:'Pull the Rug!'});
  for(const f of foes(u)){f.momentum=1;f.pump=0;f.stack=0;damage(u,f,f.maxHp*0.14+f.def,'aoe')}
  u.hp=Math.max(1,Math.round(u.hp-u.maxHp*0.15));emit('cost',{u})}

 function act(u){
  u.actions++;
  if(u.id==='shiller'&&u.actions%3===0){const m=mates(u).filter(x=>x!==u).sort((a,b)=>effAtk(a)-effAtk(b))[0]||u;m.pump=4;emit('buff',{u:m,src:u,text:'Pumped +50%'})}
  const fs=foes(u);if(!fs.length)return;
  // Targeting: usually the front, sometimes anyone. Damage spreads, but the front still takes the most.
  let tgt=r()<FRONT_FOCUS?fs[0]:fs[Math.floor(r()*fs.length)];
  if(u.side==='A'&&focus&&focus.alive)tgt=focus;
  if(u.id==='degen'&&r()<0.35)tgt=fs[Math.floor(r()*fs.length)];
  if(u.panic){u.panic=false;if(r()<0.6){emit('miss',{u});return}}
  if(r()<fxv(u,'miss',0)){emit('miss',{u});return}
  let mult=1;u.hits++;
  if(u.id==='bull'&&u.firstHit){mult=2;u.firstHit=false;emit('ability',{u,text:'Charge!'})}
  if(u.id==='degen'){mult=0.2+r()*2.4;if(mult>2)emit('ability',{u,text:'Full send!'})}
  if(u.id==='nocoiner'&&tgt.hp<tgt.maxHp*0.5)mult*=1.75;
  const whaleBig=u.id==='whale'&&u.hits%3===0;
  if(whaleBig){mult*=2.6;emit('ability',{u,text:'Market Order!'})}
  if(u.dbl>0){u.dbl--;mult*=2}
  let crit=false;if(r()<0.10){crit=true;mult*=1.5}
  const raw=effAtk(u)*mult*(0.85+r()*0.3);  // ±15% spread on every hit
  if(crit)emit('crit',{u:tgt,src:u});
  damage(u,tgt,raw,'hit');
  if(whaleBig)for(const o of foes(u))if(o!==tgt)damage(u,o,raw*0.20,'aoe');
  if(u.pump>0)u.pump--;
  if(u.id==='bull')u.momentum*=1.04;
  if(u.id==='shrimp')u.stack+=0.6;
  if(u.id==='bear'&&tgt.alive&&tgt.dumped<2){tgt.dumped++;emit('debuff',{u:tgt,text:'Dumped'})}
  if(u.id==='fudster'&&tgt.alive){tgt.panic=true;emit('debuff',{u:tgt,text:'FUD'})}
 }

 // ---- specials: charged by fighting, fired by the player (side A) or automatically (AI)
 function pickTarget(u){const fs=foes(u);if(!fs.length)return null;return (u.side==='A'&&focus&&focus.alive)?focus:fs[0]}
 function special(u){if(!u.alive||u.en<100||done)return false;u.en=0;u.specials++;const sp=ROSTER[u.id].sp;emit('special',{u,text:sp});
  const t=pickTarget(u),fs=foes(u),ms=mates(u),A0=effAtk(u);
  switch(u.id){
   case 'bull':u.dbl=4;break;
   case 'bear':for(const f of fs)setfx(f,'atk',0.7,6);break;
   case 'whale':if(t){damage(u,t,A0*3,'special');for(const o of foes(u))if(o!==t)damage(u,o,A0*1.5,'aoe')}break;
   case 'diamond':for(const m of ms)setfx(m,'taken',0.5,5);break;
   case 'rugpuller':for(const f of fs){f.momentum=1;f.pump=0;f.stack=0;f.dbl=0;delete f.fx.atk;delete f.fx.taken;damage(u,f,f.maxHp*0.12,'special')}break;
   case 'maxi':if(t){damage(u,t,A0*2,'pierce');if(t.alive)damage(u,t,A0*2,'pierce')}break;
   case 'degen':if(r()<0.6){if(t)damage(u,t,A0*4.5,'special')}else{u.hp=Math.max(1,Math.round(u.hp-u.maxHp*0.08));emit('cost',{u})}break;
   case 'shiller':for(const m of ms)setfx(m,'atk',1.5,6);break;
   case 'fudster':for(const f of fs)setfx(f,'miss',0.5,5);break;
   case 'crab':setfx(u,'taken',0.5,4);setfx(u,'reflect',1,4);break;
   case 'shrimp':u.stack+=6;u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*0.15));break;
   case 'paperhands':setfx(u,'dodge',1,2);u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*0.15));break;
   case 'nocoiner':if(t){if(t.hp<t.maxHp*0.35)damage(u,t,t.hp+t.def+99,'pierce');else damage(u,t,A0*2.6,'pierce')}break;
  }
  const a=A.some(x=>x.alive),b=B.some(x=>x.alive);if(!a||!b){done=a?'A':b?'B':'draw';emit('end',{winner:done})}
  return true}
 return{A,B,all,events:ev,get time(){return time},get done(){return done},special,
  setFocus(u){focus=u&&u.alive&&u.side==='B'?u:null},get focus(){return focus},
  step(dt){ if(done)return; time+=dt;
   for(const u of all){if(!u.alive)continue;gain(u,dt*(time>40?8:4));
    // AI side (and side A when autoA is on) fires its special after a short, human-like pause
    if(u.en>=100&&(u.side==='B'||opts.autoA)){if(u.wait<0)u.wait=0.3+r()*1.2;u.wait-=dt;if(u.wait<=0){u.wait=-1;special(u);if(done)return}}}
   for(const u of all){if(!u.alive)continue;u.t-=dt*u.spd;if(u.t<=0){u.t+=1;act(u);if(done)break}
    const a=A.some(x=>x.alive),b=B.some(x=>x.alive);
    if(!a||!b){done=a?'A':b?'B':'draw';emit('end',{winner:done});break}}
   if(!done&&time>=120){const ha=A.reduce((s,x)=>s+(x.alive?x.hp/x.maxHp:0),0),hb=B.reduce((s,x)=>s+(x.alive?x.hp/x.maxHp:0),0);
    done=ha>=hb?'A':'B';emit('end',{winner:done,timeout:true})}
  }};
}

// ---------------- run state ----------------
let run=null;           // persistent between rooms
let party=[],enemies=[],props=[],shots=[],hazards=[],fx=[],obstacles=[],doors=[];
let target=null,trail=[],paused=true,shake=0,pump={cd:0,t:0},roomCleared=false,room=null,time=0;
const maxHp=p=>Math.round(ROSTER[p.id].hp*T.partyHp*(1+run.b.hp));
function newRun(ids){run={seed:Date.now()>>>0,floor:0,room:0,hype:0,b:{hp:0,atk:0,def:0,spd:0,pumpDur:0,pumpCd:T.pumpCd,lifesteal:0,move:0},
  party:ids.map(id=>({id,hp:0,down:false})),next:'fight',stats:{kills:0,safe:0,fell:0,rooms:0},taken:[]};
 run.party.forEach(p=>p.hp=maxHp(p));}
const rnd=()=>Math.random();
const pickR=a=>a[Math.floor(rnd()*a.length)];
function save(){if(run)store.set('er2_run',JSON.stringify(run))}
function roomNo(){return run.floor*4+run.room+1}
function best(n){store.set('er_best',Math.max(+(store.get('er_best')||0),n))}

// ---------------- building a room ----------------
function makeUnit(id,side,x,y,mult=1,extra={}){const r=ROSTER[id];
 const u={id,side,x,y,face:1,alive:true,cd:.3+rnd()*.6,flash:0,lunge:0,moving:false,wt:0,vx:0,vy:0,hits:0,stack:0,momentum:1,saved:false,ranged:RANGED.has(id),...extra};
 if(side==='A'){const p=extra.ref;u.maxHp=maxHp(p);u.hp=p.hp;u.atk=r.atk*(1+run.b.atk);u.def=r.def+run.b.def;u.spd=r.spd*(1+run.b.spd)}
 else{u.maxHp=Math.round(r.hp*T.enemyHp*mult*(extra.boss?1:1));u.hp=u.maxHp;u.atk=r.atk*T.enemyAtk*Math.sqrt(mult);u.def=r.def;u.spd=r.spd}
 return u;}
function enterRoom(type){
 room={type,floor:run.floor,idx:run.room};time=0;
 enemies=[];props=[];shots=[];hazards=[];fx=[];obstacles=[];trail=[];target=null;roomCleared=false;
 const F=FLOORS[run.floor];const lvl=T.base+T.step*(run.floor*4+run.room);
 // obstacles: trading desks and server racks
 const layouts=[[],[{x:60,y:250,w:70,h:26},{x:230,y:250,w:70,h:26}],[{x:150,y:200,w:60,h:60}],[{x:40,y:180,w:26,h:110},{x:294,y:300,w:26,h:110}],[{x:110,y:330,w:140,h:22}]];
 obstacles=type==='boss'?[]:pickR(layouts).map(o=>({...o}));
 // regroup: everyone still standing recovers a little between rooms
 if(room.idx>0||room.floor>0)run.party.forEach(p=>{if(!p.down)p.hp=Math.min(maxHp(p),p.hp+Math.round(maxHp(p)*.12))});
 party=run.party.filter(p=>!p.down).map((p,k)=>makeUnit(p.id,'A',W/2+(k-1.5)*26,H-50+k*6,1,{ref:p}));
 const spawn=(id,mult,extra={})=>{let x,y,tries=0;do{x=50+rnd()*(W-100);y=TOP+40+rnd()*220;tries++}while((blocked(x,y)||Math.hypot(x-W/2,y-(H-50))<200)&&tries<40);enemies.push(makeUnit(id,'B',x,y,mult,extra))};
 if(type==='fight'){const n=2+Math.min(2,Math.floor((run.floor*4+run.room)/3));for(let i=0;i<n;i++)spawn(pickR(F.pool),lvl)}
 if(type==='elite'){spawn(pickR(F.pool),lvl*T.elite,{elite:true});spawn(pickR(F.pool),lvl);spawn(pickR(F.pool),lvl)}
 if(type==='vault'){for(let i=0;i<14;i++)props.push({t:'coin',x:60+(i%7)*40,y:TOP+60+Math.floor(i/7)*40});spawn(pickR(F.pool),lvl);spawn(pickR(F.pool),lvl)}
 if(type==='boss'){const B=F.boss;const b=makeUnit(B.id,'B',W/2,TOP+110,1,{boss:true,name:B.name});b.maxHp=Math.round(ROSTER[B.id].hp*T.bossHp[run.floor]);b.hp=b.maxHp;b.atk=ROSTER[B.id].atk*T.bossAtk[run.floor];b.def=ROSTER[B.id].def;b.spd=.7;b.ranged=false;b.pat=0;b.patT=3.5;b.phase2=false;enemies.push(b);
  hint(`${B.name} blocks the exit. Dodge the red zones.`)}
 if(type==='scam'){const avail=EVENTS.filter(e=>!run.taken.includes(e.id));const ev=avail.length?pickR(avail):pickR(EVENTS);
  props.push(ev.obj==='chest'?{t:'chest',x:W/2,y:250,ev}:{t:'npc',id:ev.who,x:W/2,y:250,ev});hint('Something is waiting for you…')}
 if(type==='heal'){props.push({t:'shrine',x:W/2,y:250});hint('Step on the green candle to heal')}
 if(type==='recruit'){const have=new Set(run.party.map(p=>p.id));const id=pickR(IDS.filter(i=>!have.has(i)));props.push({t:'cage',id,x:W/2,y:240});hint(`A ${ROSTER[id].name} wants to join`)}
 if(type==='shop'){props.push({t:'npc',id:'whale',x:W/2,y:240,shop:true});hint('Talk to the OTC dealer')}
 if(type==='fight'||type==='elite'||type==='vault')hint(type==='elite'?'An elite crew. Use PUMP IT.':'Clear the room to unlock the exits');
 // exits: two doors with the next room types, or one boss door
 const last=run.room===2;
 if(run.room===3)doors=[{x:W/2,type:'exit'}];
 else if(last)doors=[{x:W/2,type:'boss'}];
 else{const opts=['fight','elite','scam','heal','recruit','shop','vault'];const w={fight:4,elite:2,scam:3,heal:2,recruit:run.party.length<4?2:.5,shop:2,vault:1.5};
  const draw=()=>{let tot=opts.reduce((s,o)=>s+w[o],0),x=rnd()*tot;for(const o of opts){x-=w[o];if(x<0)return o}return 'fight'};
  let a=draw(),b=draw();let g=0;while(b===a&&g++<10)b=draw();doors=[{x:100,type:a},{x:260,type:b}];}
 roomCleared=!enemies.length;
 if(run.room===0)store.set('er2_ckpt',JSON.stringify(run));   // checkpoint: start of each floor
 save();best(roomNo());renderHud();paused=false;}
function blocked(x,y,r=12){return obstacles.some(o=>x>o.x-r&&x<o.x+o.w+r&&y>o.y-r&&y<o.y+o.h+r)}

// ---------------- input ----------------
let pdown=false;
const toWorld=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}};
cv.addEventListener('pointerdown',e=>{if(paused)return;pdown=true;target=toWorld(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(pdown&&!paused)target=toWorld(e)});
addEventListener('pointerup',()=>{pdown=false});
const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){usePump();e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});
$('pump').onclick=usePump;
function usePump(){if(paused||pump.cd>0||!alive(party).length)return;pump.t=T.pumpDur+run.b.pumpDur;pump.cd=run.b.pumpCd;sfx.pump();for(const p of alive(party))float(p.x,p.y-80,'PUMP!','#3fbf7a');}

// ---------------- simulation ----------------
const alive=a=>a.filter(u=>u.alive);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const nearest=(u,l)=>{let b=null,d=1e9;for(const t of l){const k=dist(u,t);if(k<d){d=k;b=t}}return b};
function step(dt){
 time+=dt;
 const lead=alive(party)[0];if(!lead)return;
 if(pump.t>0)pump.t-=dt;if(pump.cd>0)pump.cd-=dt;
 const pumped=pump.t>0;
 // leader
 let kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
 if(kx||ky)target={x:lead.x+kx*40,y:lead.y+ky*40};
 if(target){const vx=target.x-lead.x,vy=target.y-lead.y,d=Math.hypot(vx,vy);
  if(d>4){const s=T.move*(1+run.b.move)*dt;moveTo(lead,lead.x+vx/d*Math.min(d,s),lead.y+vy/d*Math.min(d,s));lead.moving=true;if(Math.abs(vx)>2)lead.face=vx<0?-1:1}else{lead.moving=false;if(!pdown)target=null}}else lead.moving=false;
 if(lead.moving){trail.unshift({x:lead.x,y:lead.y});if(trail.length>160)trail.pop()}
 alive(party).slice(1).forEach((p,k)=>{const pt=trail[Math.min(trail.length-1,(k+1)*14)];if(!pt)return;const vx=pt.x-p.x,vy=pt.y-p.y,d=Math.hypot(vx,vy);p.moving=d>2;if(d>1){moveTo(p,p.x+vx*Math.min(1,dt*8),p.y+vy*Math.min(1,dt*8));if(Math.abs(vx)>1)p.face=vx<0?-1:1}});
 // enemies
 for(const e of alive(enemies)){const t=nearest(e,alive(party));const d=t?dist(e,t):1e9;const sp=(e.boss?55:58)*dt;
  if(e.boss)bossAI(e,dt,t);
  if(t&&(d<220||e.aggro)){e.aggro=true;const want=e.ranged?120:44;
   if(d>want+6){moveTo(e,e.x+(t.x-e.x)/d*sp,e.y+(t.y-e.y)/d*sp);e.moving=true}else if(e.ranged&&d<want-30&&d>0){moveTo(e,e.x-(t.x-e.x)/d*sp,e.y-(t.y-e.y)/d*sp);e.moving=true}else e.moving=false;e.face=t.x<e.x?-1:1}
  else{e.wt-=dt;if(e.wt<=0){e.wt=1+rnd()*2;const a=rnd()*6.28;e.vx=Math.cos(a)*28;e.vy=Math.sin(a)*28}moveTo(e,e.x+e.vx*dt,e.y+e.vy*dt);e.moving=true;if(Math.abs(e.vx)>3)e.face=e.vx<0?-1:1}}
 // safety: a unit with a broken position comes back into the room (otherwise the room never clears)
 for(const u of [...party,...enemies])if(!isFinite(u.x)||!isFinite(u.y)){u.x=W/2;u.y=TOP+120}
 // keep bodies apart
 const all=[...alive(party),...alive(enemies)];
 for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j],d=dist(a,b),min=a.boss||b.boss?44:24;if(d<min&&d>0){const p=(min-d)/2,nx=(a.x-b.x)/d,ny=(a.y-b.y)/d;if(a!==lead)moveTo(a,a.x+nx*p,a.y+ny*p);if(b!==lead)moveTo(b,b.x-nx*p,b.y-ny*p)}}
 // attacks
 for(const u of all){if(u.flash>0)u.flash-=dt;if(u.lunge>0)u.lunge-=dt;
  const boost=u.side==='A'&&pumped?T.pumpSpd:1;u.cd-=dt*u.spd*boost;if(u.cd>0)continue;
  const foes=u.side==='A'?alive(enemies):alive(party);const t=nearest(u,foes);if(!t)continue;const d=dist(u,t);
  if(u.ranged&&d<T.ranged){u.cd=1.15;shoot(u,t);continue}
  if(d<(u.boss?70:T.melee)){u.cd=1.05;melee(u,t)}}
 // projectiles
 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(blocked(s.x,s.y,0)||s.x<20||s.x>W-20||s.y<TOP-10||s.y>H)s.life=0;
  const foes=s.side==='A'?alive(enemies):alive(party);for(const t of foes)if(Math.hypot(t.x-s.x,(t.y-30)-s.y)<22){hit(s.src,t,s.dmg,true);s.life=0;break}}
 shots=shots.filter(s=>s.life>0);
 // telegraphed hazards
 for(const z of hazards){z.t-=dt;if(z.t<=0&&!z.done){z.done=true;shake=.25;sfx.boom();
  for(const p of alive(party)){const inside=z.kind==='circle'?Math.hypot(p.x-z.x,p.y-z.y)<z.r:(p.y>z.y&&p.y<z.y+z.h);if(inside)hit(null,p,Math.round(p.maxHp*z.pct),false,true)}}}
 hazards=hazards.filter(z=>z.t>-.35);
 // pickups
 for(const p of props){if(p.gone)continue;const d=dist(p,lead);
  if(p.reset&&d>90){p.reset=false;p.used=false}   // you can talk to them again after walking away
  if(p.t==='coin'&&d<24){p.gone=true;run.hype+=2;sfx.coin();float(p.x,p.y-10,'+2','#e3b54a');renderHud()}
  if((p.t==='chest'||p.t==='npc')&&d<40&&!p.used){p.used=true;target=null;pdown=false;p.shop?openShop(p):openEvent(p)}
  if(p.t==='shrine'&&d<36&&!p.used){p.used=true;healParty();p.gone=true}
  if(p.t==='cage'&&d<40&&!p.used){p.used=true;target=null;pdown=false;openRecruit(p)}}
 if(!roomCleared&&!alive(enemies).length){roomCleared=true;onCleared()}
 // doors
 if(roomCleared)for(const dr of doors)if(Math.abs(lead.x-dr.x)<34&&lead.y<TOP+26){leave(dr);break}
 fx=fx.filter(f=>(f.t-=dt)>0);for(const f of fx)f.y-=dt*30;if(shake>0)shake-=dt;
}
function moveTo(u,x,y){if(!isFinite(x)||!isFinite(y))return;x=Math.max(28,Math.min(W-28,x));y=Math.max(TOP+14,Math.min(H-16,y));
 if(!blocked(x,y))(u.x=x,u.y=y);else if(!blocked(x,u.y))u.x=x;else if(!blocked(u.x,y))u.y=y;}
function shoot(u,t){const d=dist(u,t)||1;const s=140;shots.push({x:u.x,y:u.y-34,vx:(t.x-u.x)/d*s,vy:(t.y-u.y)/d*s,side:u.side,src:u,dmg:atkOf(u)*.9,life:2,c:u.id==='fudster'?'#9b7cff':u.id==='shiller'?'#ffb84a':'#c9d1e6'});u.lunge=.1}
function atkOf(u){let a=u.atk*(u.side==='A'&&pump.t>0?T.pumpAtk:1)*u.momentum+u.stack;return a}
function melee(u,t){u.hits++;let m=1;
 if(u.id==='bull'&&u.hits===1)m=2;if(u.id==='degen')m=.3+rnd()*2.2;if(u.id==='nocoiner'&&t.hp<t.maxHp*.5)m*=1.6;
 const big=u.id==='whale'&&u.hits%3===0;if(big){m*=2.4;float(u.x,u.y-90,'MARKET ORDER','#e3b54a')}
 hit(u,t,atkOf(u)*m);u.lunge=.12;
 if(big)for(const o of alive(u.side==='A'?enemies:party))if(o!==t&&dist(o,t)<80)hit(u,o,atkOf(u)*m*.35);
 if(u.id==='bull')u.momentum=Math.min(1.6,u.momentum*1.04);if(u.id==='shrimp')u.stack+=.5;}
function hit(src,t,raw,ranged=false,hazard=false){if(!t.alive)return;
 if(t.id==='paperhands'&&!hazard&&rnd()<.22){float(t.x,t.y-70,'dodged','#9aa3c0');return}
 let crit=!hazard&&rnd()<.1;let d=hazard?raw:Math.max(1,Math.round(raw*(.85+rnd()*.3)*(crit?1.5:1)-t.def));
 if(t.id==='diamond')d=Math.min(d,Math.round(t.maxHp*.14));
 if(t.id==='maxi'&&!t.saved&&d>=t.hp){t.saved=true;d=t.hp-1;float(t.x,t.y-95,'NEVER SELLING','#e3b54a')}
 t.hp-=d;t.flash=.12;fx.push({t:.9,x:t.x+(rnd()*16-8),y:t.y-62,txt:(crit?L('CRIT')+' ':'')+'-'+d,c:t.side==='A'?'#ffb4ad':crit?'#e3b54a':'#fff'});sfx.hit();
 if(t.id==='crab'&&src&&src.alive&&!ranged){const back=Math.max(1,Math.round(d*.3));src.hp-=back;src.flash=.1;if(src.hp<=0)ko(src)}
 if(t.side==='A'){t.ref.hp=Math.max(0,t.hp);renderHud()}
 if(t.hp<=0)ko(t);}
function ko(t){if(!t.alive)return;t.alive=false;t.hp=0;sfx.ko();
 if(t.side==='A'){t.ref.down=true;t.ref.hp=0;float(t.x,t.y-80,'LIQUIDATED','#e2574c');renderHud();
  if(!alive(party).length)setTimeout(gameOver,700)}
 else{run.stats.kills++;float(t.x,t.y-80,'KO','#e3b54a');dropCoin(t.x,t.y);if(t.elite||t.boss)for(let i=0;i<(t.boss?8:3);i++)dropCoin(t.x+(rnd()-.5)*90,t.y+(rnd()-.5)*60);
  if(run.b.lifesteal)for(const p of alive(party)){p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*run.b.lifesteal));p.ref.hp=p.hp}renderHud()}}
// bosses: telegraphed attacks the player must walk out of
function bossAI(b,dt,t){b.patT-=dt;if(!t)return;
 if(!b.phase2&&b.hp<b.maxHp*.5){b.phase2=true;shake=.5;float(b.x,b.y-110,b.id==='rugpuller'?'PULL THE RUG!':b.id==='bear'?'CAPITULATION!':'LIQUIDITY GRAB!','#e3b54a');sfx.rug();
  if(b.id==='whale')for(let i=0;i<2;i++)enemies.push(makeUnit(pickR(['shrimp','fudster']),'B',b.x+(i?60:-60),b.y+30,T.base+T.step*10));}
 if(b.patT>0)return;
 const fast=b.phase2?.7:1;
 if(b.id==='rugpuller'){const y=Math.max(TOP+20,Math.min(H-110,t.y-45));hazards.push({kind:'band',y,h:90,t:1.3,T:1.3,pct:.18});b.patT=4.4*fast;hint('Get off the rug!')}
 else if(b.id==='bear'){for(const p of alive(party).slice(0,b.phase2?3:1))hazards.push({kind:'circle',x:p.x,y:p.y,r:62,t:1.25,T:1.25,pct:.2});b.patT=3.8*fast}
 else{b.pat++;if(b.pat%2){hazards.push({kind:'circle',x:t.x,y:t.y,r:78,t:1.3,T:1.3,pct:.22})}else{const y=Math.max(TOP+20,Math.min(H-110,t.y-45));hazards.push({kind:'band',y,h:90,t:1.3,T:1.3,pct:.22})}b.patT=3.4*fast}}

 if(u.side){const bw=u.boss?70:40,x=u.x-bw/2,y=u.y-H0-12-bob;ctx.fillStyle='#0009';ctx.fillRect(x-1,y-1,bw+2,6);ctx.fillStyle=u.side==='A'?'#3fbf7a':'#e2574c';ctx.fillRect(x,y,bw*Math.max(0,u.hp/u.maxHp),4);
  if(u.boss||u.elite){ctx.font='400 10px Bungee, Commissioner, sans-serif';ctx.fillStyle='#e3b54a';ctx.textAlign='center';ctx.fillText(u.boss?L(u.name).toUpperCase():L('ELITE'),u.x,y-6)}}
 else if(!u.used){ctx.font='800 18px Commissioner, sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(u.shop?'$':'…',u.x,u.y-H0-8+Math.sin(t*3)*2)}}

// ---------------- loop ----------------
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(!paused&&run)step(dt);
 const pb=$('pump');const cdMax=run?run.b.pumpCd:T.pumpCd;pb.style.setProperty('--p',pump.t>0?pump.t/(T.pumpDur+(run?run.b.pumpDur:0)):pump.cd>0?1-pump.cd/cdMax:1);pb.classList.toggle('ready',pump.cd<=0&&pump.t<=0);pb.classList.toggle('active',pump.t>0);
 draw(now);requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
resize();renderHud();requestAnimationFrame(frame);startScreen();
if(!store.get('er2_seen_help')){store.set('er2_seen_help','1');setTimeout(()=>{help();$('cl').onclick=()=>{startScreen()}},50)}
</script>
