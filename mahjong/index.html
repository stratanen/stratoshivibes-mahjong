/* Layout: one-screen game table — HUD strip, board that scales to fit, power-up dock at the thumb. Single deliberate dark look (night trading desk, gold holo accents). */
:root{
  --table:#141a2b; --table-2:#1d2540; --ink:#eef0f7; --muted:#9aa3c0;
  --gold:#e3b54a; --gold-2:#b98a24; --ivory:#f4ecd8; --edge:#cdb68a; --edge-2:#8c7346;
  --good:#3fbf7a; --bad:#e2574c;
  --f-display:"SVDisplay","Bungee","Arial Black",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 30%,var(--table-2),var(--table) 70%);background-color:var(--table);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:8px;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:20px;line-height:1;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 0 #00000066}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stat{text-align:right}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff0d;color:var(--ink);font:800 15px var(--f-body);cursor:pointer}
#boardWrap{flex:1;min-height:0;position:relative}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.tile{position:absolute;border-radius:7px;background:var(--ivory);cursor:pointer;
  box-shadow:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge-2),4px 4px 0 var(--edge-2),5px 6px 8px #0000008c;
  transition:transform .14s ease,filter .2s ease,opacity .25s ease;overflow:hidden}
.app.gold .tile{background:linear-gradient(150deg,#fff3c4,#f2d27a 55%,#e8c060);box-shadow:1px 1px 0 #c99a2e,2px 2px 0 #c99a2e,3px 3px 0 #8a6418,4px 4px 0 #8a6418,5px 6px 8px #0000008c}
.tile .stripe{position:absolute;left:0;right:0;top:0;height:7%;}
.tile img{position:absolute;left:4%;right:4%;bottom:3%;width:92%;height:auto;aspect-ratio:1;object-fit:cover;pointer-events:none}
.tile .sym{position:absolute;inset:10% 8% 20%;display:grid;place-items:center}
.tile .sym svg{width:100%;height:100%}
.tile .lbl{position:absolute;left:0;right:0;bottom:4%;text-align:center;font:800 9px/1 var(--f-body);letter-spacing:.06em;color:#3b3020}
.tile.event{background:linear-gradient(160deg,#fff6db,#f0d98f)}
.tile.event::after{content:"";position:absolute;inset:2px;border:1.5px solid var(--gold-2);border-radius:5px;pointer-events:none}
.dim .tile.blocked{filter:brightness(.62) saturate(.7)}
.tile.sel{transform:translate(-2px,-4px);filter:none!important;outline:3px solid var(--gold);outline-offset:-1px;box-shadow:1px 1px 0 var(--edge),3px 3px 0 var(--edge-2),6px 10px 14px #000000a0,0 0 18px #e3b54a99}
.tile.hint{animation:pulse .5s ease-in-out 4 alternate}
.tile.gone{opacity:0;transform:scale(.6) translateY(-20px);pointer-events:none}
.tile.shake{animation:shake .3s}
@keyframes pulse{to{outline:3px solid var(--good);transform:translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.toast{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:#0b0f1bd9;border:1px solid #ffffff22;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a;color:var(--ink);font:600 12px var(--f-body);cursor:pointer}
.pw b{font:400 11px var(--f-display);letter-spacing:.03em;color:var(--gold)}
.pw .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pw:disabled{opacity:.4;cursor:default}
.pw:focus-visible,.icon-btn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:#070a12cc;display:grid;place-items:center;padding:20px;z-index:50}
.card{width:min(360px,100%);background:linear-gradient(170deg,#232c4a,#161c30);border:1px solid #e3b54a66;border-radius:18px;padding:22px;box-shadow:0 20px 50px #000a;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold);text-wrap:balance}
.card p{margin:0;line-height:1.5;color:#d6dae8;font-size:14px}
.card .tip{background:#ffffff0d;border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:13px}
.card .tip span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;font-weight:800}
.row{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.row div{flex:1;background:#ffffff0a;border-radius:10px;padding:8px;text-align:center}
.row b{display:block;font-size:18px}
.row span{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.btn{border:0;border-radius:12px;padding:12px;background:var(--gold);color:#1a1405;font:800 15px var(--f-body);cursor:pointer}
.btn.ghost{background:#ffffff12;color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.legend figure{margin:0;text-align:center;font-size:9px;color:var(--muted);line-height:1.15}
.legend img{width:100%;border-radius:6px;background:var(--ivory);display:block;margin-bottom:3px}

.lays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lay{min-width:0}
.lay span{max-width:100%;font-size:12px;text-align:center;overflow-wrap:anywhere}
.lay{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a;color:var(--ink);font:700 13px var(--f-body);cursor:pointer}
.lay.on{border-color:var(--gold);background:#e3b54a1a}
.lay svg{width:100%;max-width:90px}
.daily{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:10px 12px;border-radius:14px;border:1px solid #e3b54a88;background:linear-gradient(90deg,#e3b54a26,#e3b54a08);color:var(--ink);text-align:left;cursor:pointer;font:700 14px var(--f-body)}
.daily .ic{font-size:22px}.daily small{display:block;font-weight:400;font-size:11px;color:var(--muted)}.daily .st{margin-left:auto;font-weight:800;color:var(--gold)}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tb{flex:1;height:36px;border-radius:99px;border:1px solid #ffffff2a;background:#ffffff0a;color:var(--muted);font:800 12px var(--f-body);cursor:pointer}
.tb.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.scrollbox{max-height:min(58vh,520px);overflow:auto;margin:0 -4px 12px;padding:0 4px}
.chap{margin-bottom:14px}.chh{display:flex;justify-content:space-between;align-items:baseline;font:800 14px var(--f-body)}
.chh span{color:var(--gold);font-size:12px}.chap>small{display:block;color:var(--muted);font-size:11px;margin:2px 0 8px}
.lvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a;color:var(--ink);cursor:pointer}
.lv svg{width:100%;max-width:70px;height:46px}
.lv b{font:400 15px var(--f-display);color:var(--gold)}
.lv.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.lv.locked{opacity:.45;cursor:default}
.lv .lock{font-size:12px;height:14px}
.stars{display:inline-flex;gap:1px;font-size:12px;line-height:1;color:#ffffff30}.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 0 6px #e3b54a88}
.stars.big{font-size:34px;gap:6px;display:flex;justify-content:center;margin:4px 0 10px}
.shopcta{display:block;text-align:center;margin:0 0 8px;padding:9px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);font:800 13px var(--f-body);text-decoration:none}
.lvtag{font:800 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.newch{color:var(--you);font-weight:800}
.warn{color:var(--muted);font-size:12px}
.lay small{font-weight:400;font-size:10px;color:var(--muted);text-align:center;line-height:1.25}
.lay:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.opt{display:flex;gap:8px;align-items:center;font-size:13px;color:#d6dae8}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.hint{animation:none;outline:3px solid var(--good)}}

/* v4 additions */
.tile.gone{transition:none}
header{flex-wrap:nowrap}
.hud{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;max-width:270px}
.hud-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:#ffffff14;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:inherit;transition:width .35s ease}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff22;background:#ffffff0a;color:var(--ink);border-radius:99px;padding:4px 10px;font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px}
.chip::after{content:"▾";color:var(--gold)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tile.sel{transform:translate(-2px,-5px);filter:none!important;outline:none;
  box-shadow:0 0 0 3px #ffd76a,0 0 0 5px #b98a2499,0 0 22px 4px #ffd76acc,6px 12px 16px #000000a0}
.tile.sel::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff3c433,transparent 60%);pointer-events:none;z-index:2}
.tile.match{animation:pop .42s cubic-bezier(.3,1.6,.5,1) forwards;pointer-events:none;z-index:99999!important}
@keyframes pop{0%{transform:translate(-2px,-5px);box-shadow:0 0 0 3px #ffd76a,0 0 24px 6px #ffd76a}
 35%{transform:translate(var(--mx),var(--my)) scale(1.12);opacity:1;box-shadow:0 0 0 3px #fff,0 0 34px 10px #ffd76a}
 100%{transform:translate(var(--mx),var(--my)) scale(.2) rotate(var(--rot));opacity:0}}
.tile.hint{animation:pulse .45s ease-in-out 6 alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--good),0 0 18px 4px #3fbf7aaa;transform:translateY(-4px)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:100000;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.float{position:absolute;pointer-events:none;z-index:100001;font:800 15px var(--f-body);color:var(--gold);text-shadow:0 2px 6px #000;animation:rise .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:100002;text-align:center;font-family:var(--f-display);color:var(--gold);text-shadow:0 3px 0 #5a3d06,0 0 24px #e3b54a88;opacity:0}
.combo b{display:block;font-weight:400;font-size:40px;line-height:1}
.combo span{font-size:13px;letter-spacing:.12em;color:#fff3c4}
.combo.on{animation:combo .9s ease-out}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.combo-bar{height:3px;border-radius:99px;background:#ffffff10;overflow:hidden;margin-top:2px}
.combo-bar i{display:block;height:100%;width:0;background:var(--good)}
.stuck{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(340px,calc(100% - 8px));box-sizing:border-box;background:#0b0f1bf2;border:1px solid #e3b54a88;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:100003;box-shadow:0 10px 30px #000a}
.stuck p{margin:0;font-size:13px;color:#d6dae8;line-height:1.4}
.stuck p b{color:var(--gold);font-family:var(--f-display);font-weight:400;font-size:15px;display:block;margin-bottom:2px}
.stuck .acts{display:flex;gap:6px}
.stuck .btn{flex:1;padding:9px 6px;font-size:13px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.row3 div{background:#ffffff0a;border-radius:10px;padding:8px 4px;text-align:center}
.row3 b{display:block;font-size:18px}
.row3 span{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.newbest{font:800 11px var(--f-body);letter-spacing:.14em;color:#1a1405;background:var(--gold);border-radius:99px;padding:3px 10px;align-self:flex-start}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.win-faces{display:flex;justify-content:center}
.win-faces img{width:52px;height:52px;border-radius:50%;background:var(--ivory);border:2px solid var(--gold);margin:0 -6px;object-fit:cover}
@media (prefers-reduced-motion:reduce){.tile.match{animation:none;opacity:0}.combo.on,.float,.spark{animation-duration:.01s}}
.icon-btn{display:grid;place-items:center;flex:none}
.hud-top .icon-btn+.icon-btn{margin-left:-6px}
.logo{font-size:24px}
.logo .eyebrow{margin:0 0 4px;color:var(--ink);letter-spacing:.18em}
header{flex-direction:column;align-items:stretch;gap:8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hbtns{display:flex;align-items:center;gap:6px}
.hbtns .chip{margin-top:0;white-space:nowrap}
.hud{max-width:none;flex-direction:row;align-items:center;gap:14px}
.hud-top{justify-content:flex-start;gap:16px}
.stat{text-align:left}
.bars{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.hud-top .icon-btn+.icon-btn{margin-left:0}
.card{box-sizing:border-box;max-height:calc(100% - 8px);overflow:auto}
a.logo{text-decoration:none;display:block}
a.logo:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.hud{flex-wrap:wrap;row-gap:8px}
.hud>.chip{margin-top:0;white-space:nowrap;flex:none;margin-left:auto}
.hud>.bars{flex:1 1 100%;order:3}
</style>

<body>


<div class="app" id="app">
  <header>
    <div class="hrow">
      <a class="logo home" href="../" aria-label="Back to the Arcade"><small class="eyebrow">‹ Arcade</small>MAHJONG</a>
      <div class="hbtns" data-svh-slot>
        <button class="icon-btn" id="sndBtn" aria-label="Mute sound"></button>
        <button class="icon-btn" id="helpBtn" aria-label="How to play">?</button>
      </div>
    </div>
    <div class="hud">
      <div class="hud-top">
        <div class="stat"><b id="sLeft">72</b><span>tiles</span></div>
        <div class="stat"><b id="sScore">0</b><span>score</span></div>
        <div class="stat"><b id="sTime">0:00</b><span>time</span></div>
      </div>
      <div class="bars">
        <div class="prog" role="progressbar" aria-label="Board cleared" aria-valuemin="0" aria-valuemax="100" id="prog"><i id="progBar"></i></div>
        <div class="combo-bar" aria-hidden="true"><i id="comboBar"></i></div>
      </div>
      <button class="chip" id="layChip" aria-label="Levels and boards"><span id="layName">Pyramid</span></button>
    </div>
  </header>
  <div id="boardWrap">
    <div id="board"></div>
    <div class="combo" id="combo" aria-live="polite"><b id="comboN">x2</b><span id="comboT">COMBO</span></div>
    <div class="stuck" id="stuck" hidden></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="dock">
    <button class="pw" id="pHint"><b>BULL RUN</b>Hint<span class="n">−50 pts</span></button>
    <button class="pw" id="pShuf"><b>BEAR MKT</b>Shuffle<span class="n" id="nShuf"></span></button>
    <button class="pw" id="pUndo"><b>SEC NEWS</b>Undo<span class="n">−25 pts</span></button>
    <button class="pw" id="pNew"><b>RESTART</b>New game<span class="n" id="nLay"></span></button>
  </div>
</div>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let layoutKey=LAYOUTS[store.get('dm_layout')]?store.get('dm_layout'):'pyramid';
const sk=()=>mode==='daily'?'dm_save_daily':'dm_save_v1';
const DAILY_PARAM=new URLSearchParams(location.search).has('daily')&&!!window.SVPass;
const dailyLevel=()=>{const r=SVPass.rng('mjboard'+SVPass.today());return LEVELS[6+Math.floor(r()*18)]};
let lvStars={};try{lvStars=JSON.parse(store.get('dm_lv')||'{}')||{}}catch(e){}
const FREE_LV=24;
const unlocked=()=>{let i=0;while(i<FREE_LV-1&&lvStars[i])i++;return i};
const paidOK=()=>!!(window.SVShop&&SVShop.has('season'));
const isOpen=i=>i<FREE_LV?i<=unlocked():paidOK()&&(i===FREE_LV||!!lvStars[i-1]);   // first level not yet cleared
let mode=store.get('dm_mode')==='free'?'free':'level', lvl=Math.min(unlocked(),LEVELS.length-1);
if(store.get('dm_lvl')!=null){const v=+store.get('dm_lvl');if(v>=0&&v<LEVELS.length&&isOpen(v))lvl=v}
let dim=store.get('dm_dim')!=='0';
const $=id=>document.getElementById(id);
const st={tiles:[],sel:null,hist:[],shuf:SHUFFLES,elapsed:0,running:false,t0:0,moves:0,score:0,combo:0,bestCombo:0,lastMatch:0,hints:0,over:false,date:null};
const total=()=>st.tiles.length||72;
let timer=null, idleT=null, comboT=null;

function layout(){const p=[];for(const [z,y,xs] of LAYOUTS[layoutKey].rows)for(const x of xs)p.push({x,y,z});return p;}
function freeIn(t,set){
 for(const o of set){if(o!==t&&o.z===t.z+1&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2)return false;}
 let L=false,R=false;
 for(const o of set){if(o===t||o.z!==t.z||Math.abs(o.y-t.y)>=2)continue;if(o.x===t.x-2)L=true;if(o.x===t.x+2)R=true;}
 return !(L&&R);}
const alive=()=>st.tiles.filter(t=>!t.gone);
const isFree=t=>freeIn(t,alive());
const shuffleArr=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

// Deal by reverse play so every board is solvable
function assign(positions,pairs,dry){
 for(let attempt=0;attempt<300;attempt++){
  const rem=new Set(positions);let ok=true;const out=new Map();
  for(const pr of shuffleArr(pairs.slice())){const fr=[...rem].filter(t=>freeIn(t,rem));
   if(fr.length<2){ok=false;break}
   shuffleArr(fr);rem.delete(fr[0]);rem.delete(fr[1]);out.set(fr[0],pr[0]);out.set(fr[1],pr[1]);}
  if(ok){if(!dry)for(const [t,f] of out){t.g=f.g;t.v=f.v}return true}}
 return false;}

function resetState(){stopClock();Object.assign(st,{date:null,sel:null,hist:[],shuf:SHUFFLES,elapsed:0,running:false,moves:0,score:0,combo:0,bestCombo:0,lastMatch:0,hints:0,over:false});}
function newGame(){
 resetState();
 if(mode==='level'){const L=LEVELS[lvl];layoutKey=L.k;st.shuf=L.shuf;store.set('dm_lvl',lvl)}
 if(mode==='daily'){layoutKey=dailyLevel().k;st.shuf=2;st.date=SVPass.today()}else store.set('dm_mode',mode);
 const _rand=Math.random;if(mode==='daily')Math.random=SVPass.rng('mjdeal'+st.date);try{
 const pos=layout().map((p,i)=>({...p,i,gone:false}));
 // smaller boards use fewer kinds of tiles: whole groups of 4, plus one extra pair when needed
 const need=pos.length/2;const pairs=[];
 for(let pass=0;pass<3&&pairs.length<need;pass++)for(const gi of shuffleArr(GROUPS.map((g,gi)=>gi))){if(pairs.length>=need)break;const g=GROUPS[gi];
   if(g.kind==='event'){const v=shuffleArr([0,1,2,3]);pairs.push([{g:gi,v:v[0]},{g:gi,v:v[1]}]);if(pairs.length<need)pairs.push([{g:gi,v:v[2]},{g:gi,v:v[3]}])}
   else{pairs.push([{g:gi,v:0},{g:gi,v:0}]);if(pairs.length<need)pairs.push([{g:gi,v:0},{g:gi,v:0}])}}
 assign(pos,pairs);st.tiles=pos;}finally{Math.random=_rand}store.del(sk());
 closeOv();hideStuck();render();updHud();armIdle();
 if(mode==='daily')setTimeout(()=>toast(`<span>Daily challenge</span> · <span>${LAYOUTS[layoutKey].name}</span>`,true),250);
 if(mode==='level'){const L=LEVELS[lvl];setTimeout(()=>toast(`<span>Level ${lvl+1}</span> · <span>${LAYOUTS[L.k].name}</span> · <span>par ${fmt(L.par)}</span>`,true),250)}}

// ---- save / resume
function save(){ if(st.over||!st.moves){store.del(sk());return}
 store.set(sk(),JSON.stringify({v:1,mode,lvl,date:st.date,layoutKey,tiles:st.tiles.map(t=>[t.x,t.y,t.z,t.g,t.v,t.gone?1:0]),
  hist:st.hist.map(h=>[h.a.i,h.b.i,h.score,h.combo]),shuf:st.shuf,elapsed:st.elapsed,moves:st.moves,score:st.score,bestCombo:st.bestCombo,hints:st.hints}));}
function resume(){const raw=store.get(sk());if(!raw)return false;
 try{const d=JSON.parse(raw);if(mode==='daily'&&d.date!==SVPass.today())throw 0;const n=LAYOUTS[d.layoutKey]&&LAYOUTS[d.layoutKey].rows.reduce((a,r)=>a+r[2].length,0);
  if(d.v!==1||!n||d.tiles.length!==n)throw 0;
  resetState();layoutKey=d.layoutKey;if(d.mode==='daily'){mode='daily';st.date=d.date}else{mode=d.mode==='level'&&LEVELS[d.lvl]&&LEVELS[d.lvl].k===d.layoutKey?'level':'free';if(mode==='level')lvl=d.lvl;}
  st.tiles=d.tiles.map((a,i)=>({x:a[0],y:a[1],z:a[2],g:a[3],v:a[4],gone:!!a[5],i}));
  st.hist=d.hist.map(h=>({a:st.tiles[h[0]],b:st.tiles[h[1]],score:h[2],combo:h[3]}));
  Object.assign(st,{shuf:d.shuf,elapsed:d.elapsed,moves:d.moves,score:d.score,bestCombo:d.bestCombo,hints:d.hints});
  render();updHud();toast('Welcome back. Your game was restored.');armIdle();setTimeout(checkStuck,400);return true;
 }catch(e){store.del(sk());return false}}

// ---- clock (pauses when the app is in the background)
function startClock(){if(st.running||st.over)return;st.running=true;st.t0=Date.now()-st.elapsed*1000;
 timer=setInterval(()=>{st.elapsed=Math.floor((Date.now()-st.t0)/1000);$('sTime').textContent=fmt(st.elapsed)},500);}
function stopClock(){if(timer)clearInterval(timer);timer=null;st.running=false;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(st.running){stopClock();st.paused=true}save()}else if(st.paused){st.paused=false;startClock()}});
addEventListener('pagehide',save);

// ---- board drawing
let geo={w:50,h:64,d:4};
function measure(){const W=$('boardWrap').clientWidth,H=$('boardWrap').clientHeight;
 const cols=6,rows=8;let w=Math.min((W-14)/(cols+0.35),(H-14)/(rows*1.3+0.35));w=Math.max(30,Math.min(w,92));
 geo={w,h:w*1.3,d:Math.round(w*0.13)};
 const b=$('board');b.style.width=(cols*w+geo.d*4)+'px';b.style.height=(rows*geo.h+geo.d*4)+'px';}
function faceHTML(t){const g=GROUPS[t.g];
 if(g.kind==='char')return `<div class="stripe" style="background:${g.c}"></div><img alt="" src="${IMG[g.id]}">`;
 if(g.kind==='coin')return `<div class="stripe" style="background:${g.c}"></div><div class="sym">${g.svg}</div><div class="lbl">${g.lbl}</div>`;
 const e=EVENTS[t.v];return `<div class="sym">${e.svg}</div><div class="lbl">${e.lbl}</div>`;}
function tname(t){const g=GROUPS[t.g];return g.kind==='event'?EVENTS[t.v].name+' · matches any event':g.name}
function render(){measure();const b=$('board');b.innerHTML='';
 for(const t of st.tiles){const el=document.createElement('div');t.el=el;
  el.className='tile'+(GROUPS[t.g].kind==='event'?' event':'')+(t.gone?' gone':'');el.innerHTML=faceHTML(t);
  el.setAttribute('role','button');el.setAttribute('aria-label',tname(t));
  place(t);el.addEventListener('click',()=>tap(t));b.appendChild(el);}
 refresh();}
function place(t){const {w,h,d}=geo,el=t.el;
 el.style.width=(w-3)+'px';el.style.height=(h-3)+'px';
 el.style.left=(t.x/2*w+d*3-t.z*d)+'px';el.style.top=(t.y/2*h+d*3-t.z*d)+'px';
 el.style.zIndex=t.z*1000+t.y*20+t.x;const l=el.querySelector('.lbl');if(l)l.style.fontSize=Math.max(7,w*0.16)+'px';}
const center=t=>({x:parseFloat(t.el.style.left)+geo.w/2,y:parseFloat(t.el.style.top)+geo.h/2});
const goldOK=()=>!!(window.SVShop&&SVShop.has('gold_tiles'));let gold=store.get('dm_gold')!=='0';
function refresh(){$('app').classList.toggle('dim',dim);$('app').classList.toggle('gold',gold&&goldOK());
 const a=alive();for(const t of st.tiles){if(t.gone)continue;t.el.classList.toggle('blocked',!freeIn(t,a));t.el.classList.toggle('sel',st.sel===t)}}

let toastT;function toast(m,html){const e=$('toast');if(html)e.innerHTML=m;else e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1800)}


// ---- sound: synthesized with Web Audio, no files needed
const sfx=(()=>{let ctx=null,master=null,on=store.get('dm_sound')!=='0';
 function init(){if(ctx)return ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  try{ctx=new AC();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}catch(e){ctx=null}return ctx}
 function tone(f,{t=0,d=.12,type='sine',v=.25,f2=null,a=.005}={}){if(!on||!init())return;if(ctx.state==='suspended')ctx.resume();
  const n=ctx.currentTime+t,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+a);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.02);}
 function noise({t=0,d=.25,v=.15,from=800,to=3000}={}){if(!on||!init())return;const n=ctx.currentTime+t;
  const buf=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buf;fl.type='bandpass';fl.Q.value=1.2;
  fl.frequency.setValueAtTime(from,n);fl.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  src.connect(fl);fl.connect(g);g.connect(master);src.start(n);}
 const SC=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
 return{
  get on(){return on},toggle(){on=!on;store.set('dm_sound',on?'1':'0');if(on)this.select();return on},
  select(){tone(880,{d:.06,type:'triangle',v:.18});tone(1320,{t:.02,d:.05,type:'sine',v:.08})},
  deselect(){tone(660,{d:.06,type:'triangle',v:.12})},
  locked(){tone(150,{d:.12,type:'square',v:.08,f2:110})},
  match(c){const i=Math.min(c-1,4),b=SC[i];tone(b,{d:.16,type:'triangle',v:.22});tone(SC[i+2],{t:.06,d:.22,type:'triangle',v:.2});
   tone(SC[i+3]*2,{t:.09,d:.3,type:'sine',v:.06});noise({t:.02,d:.12,v:.04,from:4000,to:8000})},
  combo(c){const s=[0,2,4].map(k=>SC[Math.min(k+c-2,7)]);s.forEach((f,k)=>tone(f*2,{t:.12+k*.05,d:.18,type:'square',v:.05}))},
  hint(){tone(1046.5,{d:.1,v:.12});tone(1318.5,{t:.12,d:.14,v:.12})},
  shuffle(){noise({d:.35,v:.18,from:400,to:2600});tone(220,{d:.3,type:'sawtooth',v:.05,f2:440})},
  undo(){tone(700,{d:.14,type:'triangle',v:.15,f2:420})},
  stuck(){tone(392,{d:.2,type:'triangle',v:.15});tone(311,{t:.18,d:.35,type:'triangle',v:.15})},
  win(){[523.25,659.25,783.99,1046.5].forEach((f,k)=>tone(f,{t:k*.11,d:.3,type:'triangle',v:.2}));
   [1046.5,1318.5,1567.98].forEach(f=>tone(f,{t:.5,d:.9,type:'sine',v:.1}));noise({t:.45,d:.6,v:.05,from:3000,to:9000})}};})();

// ---- play
function tap(t){ if(st.over||t.gone||t.el.classList.contains('match'))return;
 clearHint();armIdle();
 if(!isFree(t)){t.el.classList.remove('shake');void t.el.offsetWidth;t.el.classList.add('shake');sfx.locked();toast('Locked: free its left or right side first');return}
 startClock();
 if(st.sel===t){st.sel=null;sfx.deselect();refresh();return}
 if(st.sel&&st.sel.g===t.g){match(st.sel,t);return}
 st.sel=t;sfx.select();toast(tname(t));refresh();}

function match(a,b){st.sel=null;
 const now=Date.now();st.combo=(now-st.lastMatch<COMBO_MS&&st.combo>0)?st.combo+1:1;st.lastMatch=now;
 st.bestCombo=Math.max(st.bestCombo,st.combo);
 const g0=GROUPS[a.g];const own=g0.kind==='char'&&window.SVHolder&&SVHolder.has(g0.id);   // holder perk: +10% points for your own Degens
 const gain=Math.round(PTS*Math.min(st.combo,5)*(own?1.1:1));st.hist.push({a,b,score:st.score,combo:st.combo-1});st.score+=gain;st.moves++;
 a.gone=b.gone=true;
 const ca=center(a),cb=center(b),m={x:(ca.x+cb.x)/2,y:(ca.y+cb.y)/2};
 [[a,ca,-1],[b,cb,1]].forEach(([t,c,s])=>{const el=t.el;el.style.setProperty('--mx',(m.x-c.x)+'px');el.style.setProperty('--my',(m.y-c.y)+'px');el.style.setProperty('--rot',(s*12)+'deg');
  el.classList.remove('sel','hint');el.classList.add('match');
  setTimeout(()=>{el.classList.remove('match');el.classList.add('gone')},430);});
 setTimeout(()=>{burst(m);floatText(m,'+'+gain)},150);
 sfx.match(st.combo);if(st.combo>=2){showCombo(st.combo);sfx.combo(st.combo)}
 runComboBar();updHud();refresh();save();
 setTimeout(()=>{alive().length?checkStuck():win()},460);}

function burst(m){const b=$('board');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let i=0;i<12;i++){const s=document.createElement('i');s.className='spark';const ang=i/12*Math.PI*2,r=26+Math.random()*26;
  s.style.left=m.x+'px';s.style.top=m.y+'px';s.style.setProperty('--dx',Math.cos(ang)*r+'px');s.style.setProperty('--dy',Math.sin(ang)*r+'px');
  if(i%3===0)s.style.background='#fff3c4';b.appendChild(s);setTimeout(()=>s.remove(),650);}}
function floatText(m,txt){const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=m.x+'px';f.style.top=m.y+'px';$('board').appendChild(f);setTimeout(()=>f.remove(),950);}
const COMBO_WORDS=['','','NICE','PUMPING','TO THE MOON','GIGABRAIN','LEGENDARY'];
function showCombo(n){const c=$('combo');$('comboN').textContent='x'+n;$('comboT').textContent=(COMBO_WORDS[Math.min(n,6)]||'LEGENDARY')+' COMBO';
 c.classList.remove('on');void c.offsetWidth;c.classList.add('on');}
function runComboBar(){const bar=$('comboBar');cancelAnimationFrame(comboT);
 const tick=()=>{const left=1-(Date.now()-st.lastMatch)/COMBO_MS;bar.style.width=Math.max(0,left*100)+'%';if(left>0&&!st.over)comboT=requestAnimationFrame(tick);else{bar.style.width='0%'}};tick();}
function breakCombo(){st.combo=0;st.lastMatch=0;cancelAnimationFrame(comboT);$('comboBar').style.width='0%';}

function freePairs(){const fr=alive().filter(isFree);const by={};for(const t of fr)(by[t.g]=by[t.g]||[]).push(t);return Object.values(by).filter(a=>a.length>1);}

// ---- hint (manual and automatic when idle)
let hinted=[];
function showHint(auto){const fp=freePairs();if(!fp.length)return false;const [a,b]=fp[Math.random()*fp.length|0];
 clearHint();hinted=[a,b];[a,b].forEach(t=>{t.el.classList.remove('hint');void t.el.offsetWidth;t.el.classList.add('hint')});
 if(!auto)toast('Bull Run: these two match');return true;}
function clearHint(){hinted.forEach(t=>t.el&&t.el.classList.remove('hint'));hinted=[];}
function doHint(){if(st.over)return;if(!showHint(false)){checkStuck();return}
 sfx.hint();st.score=Math.max(0,st.score-HINT_COST);st.hints++;breakCombo();startClock();updHud();save();armIdle();}
function armIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{if(!st.over&&$('ov').hidden&&$('stuck').hidden)showHint(true)},20000);}

function shufflePairs(a){const by={};for(const t of a)(by[t.g]=by[t.g]||[]).push({g:t.g,v:t.v});
 const pairs=[];for(const k in by){const l=shuffleArr(by[k]);for(let i=0;i<l.length;i+=2)pairs.push([l[i],l[i+1]])}return pairs}
const canShuffle=()=>st.shuf>0&&assign(alive(),shufflePairs(alive()),true);
function doShuffle(){if(st.over||st.shuf<=0)return;const a=alive();
 if(!assign(a,shufflePairs(a))){toast('No shuffle can help here. Try Undo.');return}
 sfx.shuffle();st.shuf--;st.sel=null;st.hist=[];breakCombo();clearHint();hideStuck();
 for(const t of a){t.el.innerHTML=faceHTML(t);t.el.setAttribute('aria-label',tname(t));place(t)}
 updHud();refresh();save();toast('Bear Market: tiles reshuffled');armIdle();}
function doUndo(){if(st.over||!st.hist.length)return;const h=st.hist.pop();
 sfx.undo();h.a.gone=h.b.gone=false;h.a.el.classList.remove('gone','match');h.b.el.classList.remove('gone','match');
 st.score=Math.max(0,h.score-UNDO_COST);st.moves=Math.max(0,st.moves-1);st.sel=null;breakCombo();clearHint();hideStuck();
 updHud();refresh();save();armIdle();}

// ---- stuck panel
function checkStuck(){if(st.over||!alive().length)return;if(freePairs().length){hideStuck();return}
 clearTimeout(idleT);const p=$('stuck');const left=alive().length/2;const cs=canShuffle();
 const why=cs?'Shuffle the board to keep going.':st.shuf>0?'The tiles left are stacked, so a shuffle can\'t free them. Undo a few moves to try another path.':'You are out of shuffles. Undo a few moves or start over.';
 p.innerHTML=`<p><b>No moves left</b>${left} pair${left>1?'s':''} remain, but none are free. ${why}</p><div class="acts">
  ${cs?`<button class="btn" id="stShuf">Shuffle ×${st.shuf}</button>`:''}
  ${st.hist.length?`<button class="btn ${cs?'ghost':''}" id="stUndo">Undo</button>`:''}
  <button class="btn ${cs||st.hist.length?'ghost':''}" id="stNew">${mode==='level'?'Restart level':'New game'}</button></div>`;
 if(p.hidden)sfx.stuck();p.hidden=false;
 const s=$('stShuf'),u=$('stUndo');s&&(s.onclick=doShuffle);u&&(u.onclick=doUndo);$('stNew').onclick=()=>{hideStuck();newGame()};}
function hideStuck(){$('stuck').hidden=true;}

function updHud(){const left=alive().length;$('sLeft').textContent=left;$('sScore').textContent=st.score.toLocaleString('en-US');
 const pct=Math.round((total()-left)/total()*100);$('progBar').style.width=pct+'%';$('prog').setAttribute('aria-valuenow',pct);
 $('nShuf').textContent=st.shuf+' left';$('pShuf').disabled=st.shuf<=0;$('pUndo').disabled=!st.hist.length;
 $('sTime').textContent=fmt(st.elapsed);const lab=mode==='daily'?'Daily':mode==='level'?`Level ${lvl+1}`:LAYOUTS[layoutKey].name;$('layName').textContent=lab;$('nLay').textContent=lab;}

// ---- end of game
function win(){if(st.over)return;st.over=true;stopClock();breakCombo();clearTimeout(idleT);store.del(sk());sfx.win();
 $('combo').classList.remove('on');
 const lvStarsNow=mode==='level'?1+(st.elapsed<=LEVELS[lvl].par?1:0)+(st.elapsed<=LEVELS[lvl].par&&!st.hints?1:0):0;
 try{window.SVPass&&SVPass.record('mj_clear',{tiles:total(),stars:lvStarsNow,combo:st.bestCombo})}catch(e){}
 if(mode==='daily')return winDaily();
 if(mode==='level')return winLevel();
 const key='dm_best_'+layoutKey;let best={};try{best=JSON.parse(store.get(key)||'{}')}catch(e){}
 const newTime=!best.time||st.elapsed<best.time, newScore=!best.score||st.score>best.score;
 if(newTime)best.time=st.elapsed;if(newScore)best.score=st.score;store.set(key,JSON.stringify(best));
 const faces=shuffleArr(CHARS.slice()).slice(0,5).map(c=>`<img src="${IMG[c.id]}" alt="">`).join('');
 showOv(`<div class="win-faces">${faces}</div><h2>Board cleared</h2>
  ${newTime||newScore?`<span class="newbest">NEW BEST ${newScore&&newTime?'SCORE + TIME':newScore?'SCORE':'TIME'}</span>`:''}
  <div class="row3"><div><b>${st.score.toLocaleString('en-US')}</b><span>score</span></div><div><b>${fmt(st.elapsed)}</b><span>time</span></div><div><b>x${st.bestCombo}</b><span>best combo</span></div></div>
  <p>Best on ${LAYOUTS[layoutKey].name}: ${best.score.toLocaleString('en-US')} pts · ${fmt(best.time)}${st.hints?` · ${st.hints} hint${st.hints>1?'s':''} used`:''}</p>
  <p class="tip"><span>Security tip</span>${TIPS[Math.random()*TIPS.length|0]}</p>
  <div class="btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="other">Change layout</button></div>`);
 $('again').onclick=newGame;$('other').onclick=()=>chooser();}

function starRow(n,big){return `<span class="stars${big?' big':''}" aria-label="${n} ★">${[0,1,2].map(i=>`<i class="${i<n?'on':''}">★</i>`).join('')}</span>`}
function winDaily(){const r=SVPass.finishDaily('mahjong',{score:st.elapsed,points:st.score},true);const best=SVPass.dailyResult('mahjong').best;
 const faces=shuffleArr(CHARS.slice()).slice(0,5).map(c=>`<img src="${IMG[c.id]}" alt="">`).join('');
 showOv(`<div class="win-faces">${faces}</div><div class="lvtag">Daily challenge</div><h2>${LAYOUTS[layoutKey].name}</h2><div class="lvtag">Board cleared</div>
  <div class="row3"><div><b>${fmt(st.elapsed)}</b><span>time</span></div><div><b>${fmt(best)}</b><span>best today</span></div><div><b>${r.streak} 🔥</b><span>day streak</span></div></div>
  <p>A new daily board arrives tomorrow. Same board for every player, so compare your time with friends.</p>
  <div class="btns"><button class="btn" id="again">Try for a better time</button><button class="btn ghost" id="other">Levels</button></div>`);
 $('again').onclick=newGame;$('other').onclick=()=>chooser();}
function winLevel(){const L=LEVELS[lvl];const stars=1+(st.elapsed<=L.par?1:0)+(st.elapsed<=L.par&&!st.hints?1:0);
 const prev=lvStars[lvl]||0;if(stars>prev){lvStars[lvl]=stars;store.set('dm_lv',JSON.stringify(lvStars))}
 const last=lvl>=LEVELS.length-1||!isOpen(lvl+1)&&lvl===FREE_LV-1,chEnd=(lvl+1)%6===0,toShop=lvl===FREE_LV-1&&!paidOK();
 const key='dm_best_'+layoutKey;let best={};try{best=JSON.parse(store.get(key)||'{}')}catch(e){}
 if(!best.time||st.elapsed<best.time)best.time=st.elapsed;if(!best.score||st.score>best.score)best.score=st.score;store.set(key,JSON.stringify(best));
 const how=stars<2?`Clear it within ${fmt(L.par)} for a second star.`:stars<3?'Clear it within par without hints for the third star.':'Perfect run.';
 showOv(`<div class="lvtag"><span>Level ${lvl+1}</span> · <span>${CHAPTERS[L.ch].name}</span></div><h2>${LAYOUTS[L.k].name}</h2><div class="lvtag">Board cleared</div>${starRow(stars,true)}
  <div class="row3"><div><b>${st.score.toLocaleString('en-US')}</b><span>score</span></div><div><b>${fmt(st.elapsed)}</b><span>time</span><span>par ${fmt(L.par)}</span></div><div><b>x${st.bestCombo}</b><span>best combo</span></div></div>
  <p>${how}</p>${chEnd&&!last?`<p class="newch"><span>Chapter ${L.ch+2} unlocked</span>: <span>${CHAPTERS[L.ch+1].name}</span></p>`:''}${lvl===FREE_LV-1?'<p class="newch">You cleared all 24 levels. Respect.</p>':''}${lvl===LEVELS.length-1?'<p class="newch">Seeker Season complete. You cleared every board in the Arcade.</p>':''}${toShop?'<p>Want more? <b>Seeker Season</b> adds 6 bigger boards. Find it in the Arcade Shop.</p>':''}
  <p class="tip"><span>Security tip</span>${TIPS[Math.random()*TIPS.length|0]}</p>
  <div class="btns">${toShop?'<a class="btn" href="../?shop" style="text-align:center;text-decoration:none;display:grid;place-items:center">Open the Shop</a>':last?'':'<button class="btn" id="nextLv">Next level</button>'}<button class="btn ghost" id="again">Replay</button><button class="btn ghost" id="other">Levels</button></div>`);
 const n=$('nextLv');if(n)n.onclick=()=>{lvl++;newGame()};$('again').onclick=newGame;$('other').onclick=()=>chooser();}

// ---- dialogs
function showOv(h){$('ovCard').innerHTML=h;$('ov').hidden=false;const c=$('closeOv');c&&(c.onclick=closeOv);}
function closeOv(){$('ov').hidden=true;}
function restart(){ if(st.moves>0&&!st.over){
  showOv(`<h2>Start a new game?</h2><p>You have cleared ${total()-alive().length} of ${total()} tiles. This game will be lost.</p>
   <div class="btns"><button class="btn" id="yes">New game</button><button class="btn ghost" id="closeOv">Keep playing</button></div>`);
  $('yes').onclick=newGame;} else newGame();}
function chooser(tab){const inGame=st.moves>0&&!st.over;tab=tab||'levels';const un=unlocked();
 const allStars=Object.values(lvStars).reduce((a,b)=>a+b,0);
 const lvHTML=CHAPTERS.map((c,ci)=>{const ls=LEVELS.map((L,i)=>({L,i})).filter(o=>o.L.ch===ci);const got=ls.reduce((a,o)=>a+(lvStars[o.i]||0),0);
  return `<div class="chap"><div class="chh"><b>${c.name}</b><span>${got}/18 ★</span></div><small>${c.note}</small><div class="lvs">${c.paid&&!paidOK()?'<a class="shopcta" href="../?shop">🛒 Unlock in the Shop</a>':''}${ls.map(({L,i})=>{const open=isOpen(i);
   return `<button class="lv${mode==='level'&&i===lvl?' on':''}${open?'':' locked'}" data-i="${i}" ${open?'':'disabled'} aria-label="Level ${i+1}${open?'':' (locked)'}">${mini(LAYOUTS[L.k])}<b>${i+1}</b>${open?starRow(lvStars[i]||0):'<span class="lock">🔒</span>'}</button>`}).join('')}</div></div>`}).join('');
 const frHTML=`<p>Play any board with no stars or par time. Every board can always be solved.</p><div class="lays">${LEVELS.filter(L=>L.ch<4||paidOK()).map(L=>[L.k,LAYOUTS[L.k]]).map(([k,l])=>`<button class="lay${mode==='free'&&k===layoutKey?' on':''}" data-k="${k}">${mini(l)}<span>${l.name}</span><small>${l.note}</small></button>`).join('')}</div>`;
 const dr=window.SVPass?SVPass.dailyResult('mahjong'):null;
 const dailyBtn=window.SVPass?`<button class="daily" id="dly"><span class="ic">📅</span><span><b>Daily challenge</b><small><span>${LAYOUTS[dailyLevel().k].name}</span> · <span>${dr?`best ${fmt(dr.best)} ✓`:'same board for everyone today'}</span></small></span><span class="st">${SVPass.streak().now} 🔥</span></button>`:'';
 showOv(`<h2>${tab==='levels'?'Levels':'Free play'}</h2>${dailyBtn}<div class="tabs"><button class="tb${tab==='levels'?' on':''}" id="tLv">Levels · ${allStars}/${paidOK()?90:72} ★</button><button class="tb${tab==='free'?' on':''}" id="tFr">Free play</button></div>
 ${inGame?'<p class="warn">Starting another board ends your current game.</p>':''}
 <div class="scrollbox">${tab==='levels'?lvHTML:frHTML}</div>
 <button class="btn ghost" id="closeOv">${st.over?'Close':'Keep playing'}</button>`);
 $('tLv').onclick=()=>chooser('levels');const db=$('dly');if(db)db.onclick=()=>{if(mode==='daily'&&!st.over){closeOv();return}mode='daily';if(!resume())newGame()};$('tFr').onclick=()=>chooser('free');
 document.querySelectorAll('.lv:not(.locked)').forEach(b=>b.onclick=()=>{mode='level';lvl=+b.dataset.i;newGame()});
 document.querySelectorAll('.lay').forEach(b=>b.onclick=()=>{mode='free';layoutKey=b.dataset.k;store.set('dm_layout',layoutKey);newGame()});
 const cur=document.querySelector('.lv.on');if(cur)cur.scrollIntoView({block:'center'});}
function mini(l){const r=[];const zs=Math.max(...l.rows.map(r=>r[0]));for(const [z,y,xs] of l.rows)for(const x of xs)r.push(`<rect x="${x*5-z*1.2+2}" y="${y*3.3-z*1.2+2}" width="9" height="6" rx="1" fill="var(--ivory)" stroke="var(--edge-2)" stroke-width=".6" opacity="${.55+z*(.45/Math.max(1,zs))}"/>`);
 return `<svg viewBox="0 0 66 58" aria-hidden="true">${r.join('')}</svg>`}
function help(){showOv(`<h2>How to play</h2>
 <p>Tap two matching tiles to clear them. A tile is free when nothing sits on top of it and its left or right side is open. The gold event tiles all match each other.</p>
 <div class="legend">${CHARS.map(c=>`<figure><img src="${IMG[c.id]}" alt=""><figcaption>${c.name}</figcaption></figure>`).join('')}</div>
 <p>Each match is worth ${PTS} points. Match again within ${COMBO_MS/1000} seconds to build a combo, worth up to x5 points. Hints and undos cost points and break your combo.</p>
 <p>Your game is saved as you play, so you can close the app and pick up where you left off.</p>
 <label class="opt"><input type="checkbox" id="dimOpt" ${dim?'checked':''}> Shade locked tiles</label>
 ${goldOK()?`<label class="opt"><input type="checkbox" id="goldOpt" ${gold?'checked':''}> Gold tiles (Supporter Pack)</label>`:''}
 <button class="btn ghost" id="closeOv">Back to the game</button>`);
 $('dimOpt').onchange=e=>{dim=e.target.checked;store.set('dm_dim',dim?'1':'0');refresh()};
 const go=$('goldOpt');if(go)go.onchange=e=>{gold=e.target.checked;store.set('dm_gold',gold?'1':'0');refresh()};}

$('pHint').onclick=doHint;$('pShuf').onclick=doShuffle;$('pUndo').onclick=doUndo;$('pNew').onclick=restart;
$('helpBtn').onclick=help;
const sndIcon=()=>{const b=$('sndBtn');b.innerHTML=sfx.on?SND_ON:SND_OFF;b.setAttribute('aria-label',sfx.on?'Mute sound':'Turn sound on');b.setAttribute('aria-pressed',sfx.on)};
$('sndBtn').onclick=()=>{sfx.toggle();sndIcon()};sndIcon();
$('layChip').onclick=()=>chooser();
$('ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!st.over)closeOv()});
addEventListener('resize',()=>{measure();for(const t of st.tiles)place(t)});
if(DAILY_PARAM){mode='daily'}
if(!resume())newGame();
</script>

<script src="holder.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}))}</script>
<script src="../i18n.js"></script>
</body>
</html>
